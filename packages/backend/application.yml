spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quizzem
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: off